name: Circle Health Group
description: >-
  Circle Health Group is the largest independent operator of private hospitals
  in the United Kingdom, running a nationwide network of hospitals and clinics
  that provide diagnostics, surgery, physiotherapy, and consultant-led private
  medical care to self-pay patients, insured patients, and the NHS. Originally
  backed by Balderton Capital as Circle Holdings, the group offers services
  spanning orthopaedics, cardiology, gynaecology, general surgery, and imaging.
  It was added to the API Evangelist network as a portfolio-company lead; the
  organization operates a consumer-facing patient website and does not currently
  publish a public developer API, SDK, or developer portal surface.
